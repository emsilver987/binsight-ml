# BinSight plus every TrashNet image, labeled as BinSight classes.
# No copied images. filepath is relative to image_root (data/), so one
# manifest can point at data/binsight and data/trashnet/dataset-resized.
# Rebuild after adding BinSight items or replacing TrashNet:
#   python src/make_manifest_binsight_augmented.py --config configs/binsight_augmented.yaml
# Train with the same pipeline as the other configs:
#   python src/train.py --config configs/binsight_augmented.yaml

name: binsight_augmented
image_root: data
manifest: data/manifests/binsight_augmented.csv
rules: ../rules.yaml

binsight_image_root: data/binsight
binsight_item_log: ../item_manifest.csv
trashnet_image_root: data/trashnet/dataset-resized

image_size: 96
batch_size: 32
seed: 42
val_fraction: 0.15
test_fraction: 0.15

# Full BinSight taxonomy, in rules.yaml id order. battery_electronics
# has no TrashNet images. The other classes get TrashNet only where the
# photo actually matches that class.
classes:
  - metal_can
  - plastic_bottle_jug
  - other_rigid_plastic
  - glass
  - paper
  - cardboard
  - plastic_film
  - food_organic
  - battery_electronics
  - other_landfill

# TrashNet folder -> BinSight class, for images that match the folder.
# plastic's default is plastic_bottle_jug because most of that folder is
# narrow-neck bottles and jugs. Cups, tubs, clamshells, lids, loose caps,
# film, and oil jugs are listed in trashnet_label_overrides instead.
# trash's default is other_landfill. Clear bags, food scraps, styrofoam,
# and rigid cups in that folder are overrides.
# cardboard, glass, and paper match those BinSight classes.
# metal is metal_can. Crumpled foil, wire, and scrap that is not a can
# are overrides to other_landfill. Can tops, jar lids, and foil trays stay cans.
trashnet_label_map:
  cardboard: cardboard
  glass: glass
  metal: metal_can
  paper: paper
  plastic: plastic_bottle_jug
  trash: other_landfill

trashnet_label_overrides: data/manifests/trashnet_label_overrides.csv

model:
  alpha: 0.35
  dropout: 0.2
  weights: imagenet

train:
  phase1_epochs: 5
  phase1_lr: 0.001
  phase2_epochs: 20
  phase2_lr: 0.00001
  unfreeze_fraction: 0.30
  early_stopping_patience: 5

augment:
  crop_margin: 16
  rotation_degrees: 15
  brightness_delta: 0.15
  contrast_lower: 0.8
  contrast_upper: 1.2
  horizontal_flip: true

evaluation_notes:
  - "Every TrashNet image is included. Paths stay in the original folders; image_root is data/ so filepath can reach both trees."
  - "TrashNet cardboard, glass, paper, and cans map to those BinSight classes. Plastic bottles stay plastic_bottle_jug. Clamshells, cups, tubs, lids, and loose caps are other_rigid_plastic. Bags and bubble mailers are plastic_film. Chip bags, foil, and oil jugs are other_landfill. Food scraps in the trash folder are food_organic."
  - "other_rigid_plastic, plastic_film, and food_organic get some TrashNet images. battery_electronics stays BinSight-only. train.py class weights rebalance the loss."
  - "Splits are still by item_id. A BinSight capture stays together. Each TrashNet image is its own item, so those images scatter across train, val, and test."
