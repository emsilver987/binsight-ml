# BinSight item -> class_id reference (label guide companion)
# Class ids match rules.yaml. Use this when filling material_class in the manifest.
# The CNN never sees item names — it learns the class from pixels. This file exists
# so you label consistently. If an item isn't listed, apply the precedence rules:
#   1. battery/circuitry          -> 8
#   2. unrinsable food/grease     -> 9
#   3. inseparable multi-material -> 9
#   4. otherwise dominant material
# Add every new decision here so the next similar item gets the same label.

version: "1.0"
assumes: "Items rinsed, empty, and dry unless noted"

classes:
  0: metal_can
  1: plastic_bottle_jug
  2: other_rigid_plastic
  3: glass
  4: paper
  5: cardboard
  6: plastic_film
  7: food_organic
  8: battery_electronics
  9: other_landfill

items:
  # ---------------- 0: metal_can ----------------
  soda can: 0
  beer can: 0
  sparkling water can: 0
  energy drink can: 0
  soup can: 0
  vegetable can: 0
  bean can: 0
  tuna can: 0
  pet food can: 0
  coffee can (metal): 0
  aluminum pie tin (clean): 0
  metal jar lid: 0
  aerosol can (empty): 9          # pressurized/residue risk; "when in doubt, throw it out"
  aluminum foil (crumpled): 9     # not a can; usually food-soiled
  paint can: 9                    # hazardous residue -> ToxDrop, but not electronics; keep out of Recycle

  # ---------------- 1: plastic_bottle_jug ----------------
  water bottle: 1
  soda bottle: 1
  sports drink bottle: 1
  juice bottle (plastic): 1
  milk jug: 1
  orange juice jug: 1
  laundry detergent jug: 1
  dish soap bottle: 1
  shampoo bottle: 1
  conditioner bottle: 1
  body wash bottle: 1
  mouthwash bottle: 1
  vinegar bottle (plastic): 1
  ketchup bottle (squeeze): 1
  salad dressing bottle (plastic): 1
  cooking oil bottle (plastic): 9  # oily residue doesn't rinse out
  pump/spray bottle: 1             # label as bottle; trigger mechanism is a known edge case

  # ---------------- 2: other_rigid_plastic ----------------
  yogurt cup: 2
  sour cream tub: 2
  butter tub: 2
