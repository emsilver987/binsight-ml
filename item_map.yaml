  styrofoam egg carton: 2
  plastic egg carton: 2
  peanut butter jar (plastic): 2   # wide mouth = tub shape, not bottle shape
  microwave meal tray: 2
  plastic flower pot: 2

  # ---------------- 3: glass ----------------
  beer bottle: 3
  wine bottle: 3
  glass soda bottle: 3
  pasta sauce jar: 3
  pickle jar: 3
